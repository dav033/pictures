# Despliegue manual (D-031): Actions → Deploy → Run workflow
# Nada se despliega solo tras Quality checks; el ref por defecto es main.
name: Deploy Demo Decoración to VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama, tag o SHA a desplegar
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Exigir Quality checks en verde para este SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          VERDES="$(gh api "repos/$REPO/actions/workflows/checks.yml/runs" -X GET -f head_sha="$SHA" -f status=success --jq '.workflow_runs | length')"
          if [ "$VERDES" -lt 1 ]; then
            echo "::error::No hay ejecución verde de Quality checks para $SHA; no se despliega."
            exit 1
          fi
          echo "Quality checks en verde para $SHA ($VERDES ejecución(es))."

      - name: Configure restricted SSH key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_DEPLOY_KEY:?Missing VPS_DEPLOY_KEY}"
          : "${VPS_DEPLOY_HOST:?Missing VPS_DEPLOY_HOST}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Package exact checked commit
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$SHA"

      - name: Enviar el release al VPS y ejecutar el despliegue remoto
        env:
          VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
          SHA: ${{ env.SHA }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@$VPS_DEPLOY_HOST" "$SHA" < "$RUNNER_TEMP/release.tar.gz"

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
            https://185-147-157-25.sslip.io/ -o /dev/null
