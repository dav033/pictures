services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: demo-decoracion:current
    container_name: demo-decoracion
    restart: unless-stopped
    env_file:
      - /etc/demo-decoracion/demo.env
    expose:
      - "3000"
    volumes:
      - demo-decoracion-data:/app/data
    networks:
      - web
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    image: demo-decoracion-ai-api:current
    container_name: demo-decoracion-ai-api
    restart: unless-stopped
    env_file:
      - /etc/demo-decoracion-ai/ai.env
    expose:
      - "8000"
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  demo-decoracion-data:
    external: true
    name: demo-decoracion-data

networks:
  web:
    external: true
    name: stack_web
